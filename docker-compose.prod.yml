version: '3.8'

services:
  npm:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: rabbitpos-npm
    restart: always
    ports:
      - '80:80'
      - '81:81'
      - '443:443'
    environment:
      DISABLE_HTTP2: '0'
    volumes:
      - ./npm_data:/data
      - ./npm_letsencrypt:/etc/letsencrypt
    networks:
      - rabbitpos-network

  postgres:
    image: postgres:16-alpine
    container_name: rabbitpos-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rabbitpos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rabbitpos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rabbitpos-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rabbitpos-backend
    restart: always
    environment:
      PORT: ${BACKEND_PORT:-8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-rabbitpos}
      APP_ENV: production
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://thopos.ndnworks.com,http://thopos.ndnworks.com}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rabbitpos-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rabbitpos-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.thopos.ndnworks.com/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - rabbitpos-network

networks:
  rabbitpos-network:
    driver: bridge

volumes:
  postgres_data:
