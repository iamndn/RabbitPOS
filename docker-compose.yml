services:
  postgres:
    image: postgres:16-alpine
    container_name: rabbitpos-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-rabbitpos}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rabbitpos}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rabbitpos-backend
    restart: always
    environment:
      PORT: ${BACKEND_PORT:-8080}
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-postgres}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-postgres}}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-rabbitpos}}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      APP_ENV: ${APP_ENV:-development}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://10.0.0.10:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://10.0.0.10:3000}
      JWT_SECRET: ${JWT_SECRET:-rabbitpos-dev-jwt-secret-key-2026-not-for-production}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      # Seeding: enable demo catalog in development by default
      ENABLE_SEEDING: ${ENABLE_SEEDING:-true}
      ENABLE_MULTI_STORE: ${ENABLE_MULTI_STORE:-true}
      STORE_HEADER_REQUIRED: ${STORE_HEADER_REQUIRED:-true}
      STORE_STRICT_CREATE: ${STORE_STRICT_CREATE:-false}
      INITIAL_STORE_NAME: ${INITIAL_STORE_NAME:-My Store}
      INITIAL_STORE_CODE: ${INITIAL_STORE_CODE:-main}
      # Initial admin credentials for first-run DB setup
      INITIAL_ADMIN_USERNAME: ${INITIAL_ADMIN_USERNAME:-admin}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-admin123}
      # Initial staff credentials (seeded only when ENABLE_SEEDING=true)
      INITIAL_STAFF_USERNAME: ${INITIAL_STAFF_USERNAME:-staff}
      INITIAL_STAFF_PASSWORD: ${INITIAL_STAFF_PASSWORD:-staff123}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-rabbitpos@ndnworks.com}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-RabbitPOS Notification}
      REPORT_RECIPIENT_EMAILS: ${REPORT_RECIPIENT_EMAILS:-nhanhdn.jfw@gmail.com,candynhung754@gmail.com}
      ENABLE_DAILY_EMAIL_REPORT: ${ENABLE_DAILY_EMAIL_REPORT:-true}
      DAILY_REPORT_TIME: ${DAILY_REPORT_TIME:-22:30}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/v1/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 25
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    container_name: rabbitpos-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: rabbitpos-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - backend
      - frontend
    profiles:
      - tunnel

volumes:
  postgres_data:
  backend_uploads:

